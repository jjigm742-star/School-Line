<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드클래시 2.5 | 관리자</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#0b1629;color:#eef7ff;margin:0;font:15px/1.5 system-ui,'Malgun Gothic',sans-serif}main{max-width:1000px;margin:auto;padding:20px}section{border:1px solid #3c5f7e;background:#1a2d46;border-radius:13px;padding:15px;margin:12px 0}h1{font-size:26px}button,input{background:#254766;border:1px solid #6584a1;color:white;padding:9px;border-radius:7px;font:inherit}button{cursor:pointer}button.primary{background:#007f75}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid #ffffff16}.row strong{min-width:155px}.row input[type=number]{width:90px}.row .effects{width:270px;max-width:90vw}.hint{color:#bbcadf;font-size:13px}a{color:#97e4de}
</style></head><body><main><a href="/">← 홈</a><h1>⚙️ 카드클래시 2.5 — 서버 밸런스 관리자</h1><p class="hint">서버 환경변수 CARDCLASH_ADMIN_TOKEN을 아는 관리자만 사용할 수 있어. 저장 즉시 현재 진행 중인 온라인 대전에도 카드 수치가 반영되고 서버 파일에 저장돼. 이미 지불한 비용은 환불되지 않아.</p><section><div class="row"><label>관리자 토큰 <input id="token" type="password" placeholder="서버 관리자 비밀번호" style="width:230px" autocomplete="off"></label><label>후공 추가 ME/TE <input type="number" id="bonus" min="0" max="200" step="5"></label><button class="primary" onclick="save()">💾 즉시 반영</button></div><p id="msg" class="hint"></p></section><section><h2>80종 카드 수치</h2><div id="items"></div></section></main><script>
let DATA;const $=id=>document.getElementById(id);async function load(){let r=await fetch('/api/config');DATA=await r.json();$('bonus').value=DATA.rules.second_player_first_turn_bonus;
 $('items').innerHTML=DATA.cards.map(c=>`<div class="row" data-name="${c.id}"><strong>${({Land:'🔴',Ocean:'🔵',Sky:'🤍',Others:'🟣'})[c.race]} ${c.name}</strong><label>비용 <input class="cost" type="number" min="0" max="300" value="${c.cost}"></label>${c.type==='monster'?`<label>ATK <input class="atk" type="number" min="0" max="10000" step="500" value="${c.atk}"></label>`:''}${/:[0-9]/.test(c.effects)?`<label class="hint">효과 수치 <input class="effects" value="${c.effects}"></label>`:''}</div>`).join('')}
async function save(){let cards={};for(const c of DATA.cards){let row=document.querySelector(`[data-name="${c.id}"]`),cost=Number(row.querySelector('.cost').value);let patch={cost};if(c.type==='monster')patch.atk=Number(row.querySelector('.atk').value);let e=row.querySelector('.effects');if(e)patch.effects=e.value;cards[c.name]=patch;}
 let res=await fetch('/api/admin/patch',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':$('token').value},body:JSON.stringify({cards,second_bonus:Number($('bonus').value)})});let data=await res.json();$('msg').textContent=res.ok?'✅ 서버와 현재 진행 중인 온라인 게임에 즉시 반영했어.':'❌ '+(data.detail||'반영 실패');if(res.ok){DATA=data.config;}}
load().catch(e=>$('msg').textContent='설정 로드 오류: '+e.message);
</script></body></html>
