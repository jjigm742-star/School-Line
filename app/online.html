<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드클래시 2.5 | 실시간 대전</title><style>
:root{color-scheme:dark;--bg:#071222;--panel:#14273f;--line:#3d5979}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1d3858,#080e1b 65%);color:#eff6ff;font:15px/1.45 system-ui,'Malgun Gothic',sans-serif}main{max-width:1480px;padding:14px;margin:auto}a{color:#a9ece8}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:9px}h1{font-size:24px;margin:6px 0}h2{font-size:17px;margin:0 0 9px}h3{font-size:14px;margin:0 0 6px}.panel{background:#142740ec;border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}button,select,input{font:inherit;color:white;background:#274768;border:1px solid #5b7592;padding:9px 11px;border-radius:8px;max-width:100%}button{cursor:pointer}button:hover{background:#32618a}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#067e76;border-color:#27b4a6;font-weight:bold}.small{padding:5px 8px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.hint{color:#adbed1;font-size:13px}.status{padding:11px;border-left:5px solid #f3d077;background:#263f5a;border-radius:8px;font-weight:bold;margin:8px 0}#matchArea{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.line{border:1px dashed #5d7293;background:#0d1d33;border-radius:8px;padding:7px;min-height:120px;margin:7px 0}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.card{min-width:0;min-height:96px;border:1px solid #7186a4;border-left:5px solid #ddd;background:#213b5a;border-radius:7px;padding:6px;text-align:left;word-break:keep-all;overflow-wrap:anywhere}.card strong{display:block;font-size:13px;line-height:1.3}.card small{display:block;font-size:11px;color:#cdd9e9;margin-top:4px}.card.Land{border-left-color:#e88874}.card.Ocean{border-left-color:#65bffb}.card.Sky{border-left-color:#e8e5c1}.card.Others{border-left-color:#b985fa}.card.selected{outline:3px solid #f4d37b;background:#365778}.hand{display:flex;flex-wrap:wrap;gap:6px}.hand .card{flex:1 1 125px;max-width:185px}.toolbar{display:flex;gap:5px;flex-wrap:wrap}.toolbar button{padding:8px 10px}.log{max-height:260px;overflow:auto;background:#0c1a30;border-radius:8px;padding:9px;font-size:12px}.log div{border-bottom:1px solid #ffffff09;padding:2px}#promptOverlay{position:fixed;inset:0;z-index:20;background:#020814e8;display:none;place-items:center;padding:16px}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:#203b5c;padding:18px;border:1px solid #8db4d9;border-radius:14px}.choice{display:block;text-align:left;width:100%;margin:7px 0}.deckitem{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:7px;border-bottom:1px solid #ffffff14}.deckitem span{flex:1}.deckscroll{max-height:50vh;overflow:auto}.counter{width:40px;text-align:center;font-weight:800}.hidden{display:none!important}.name{font-weight:800}.deckcount{color:#f9dd94;font-weight:bold}.info{font-size:12px;color:#b6c8df}#notice{color:#ffcf95}#leave{color:#ffc5c5} @media(max-width:900px){main{padding:7px}.grid{grid-template-columns:1fr}.cards{gap:3px}.card{padding:4px;min-height:82px}.card strong{font-size:11px}.card small{font-size:10px}.panel{padding:9px}.hand .card{flex-basis:110px}button{padding:8px}}
 .effect-math{font-weight:700!important;color:#ffdc82!important;font-size:10px!important;overflow-wrap:anywhere}.deck-flash{display:inline-block;animation:deckFlash .55s ease-in-out 2;color:#ffde8b!important}@keyframes deckFlash{0%,100%{transform:scale(1);opacity:1}45%{transform:scale(1.16);opacity:.18}}.grave-item{padding:10px;margin:5px 0;border:1px solid #526b8a;border-radius:7px}.grave-item b{display:block}.grave-item small{display:block;color:#cad9f1}.hidden{display:none!important}@media(prefers-reduced-motion:reduce){.deck-flash{animation:none}}
</style></head><body><main><header><h1>⚔️ 카드클래시 2.5 <small class="hint">실시간 대전</small></h1><a href="/">← 모드 선택</a></header><section class="panel" id="lobby"><h2>대전 입장</h2><p class="hint">서버가 카드·덱을 관리하고 상대 손패를 숨겨. 매칭 전에 자기 종족 덱을 수정할 수 있어.</p><div class="row"><label>사용할 종족 <select id="race"><option value="Land">🔴 랜드</option><option value="Ocean">🔵 오션</option><option value="Sky">🤍 스카이</option><option value="Others">🟣 아더스</option></select></label><label>내 덱 <select id="namedDeck" onchange="selectNamedDeck()"></select></label><button id="editBtn" onclick="editDeck()">🛠️ 덱 관리·생성·출력</button><span class="deckcount" id="deckStatus"></span></div><div class="row" style="margin-top:12px"><button class="primary" onclick="connect('queue')">🎲 자동 매칭</button><button onclick="connect('create')">🔒 친구 방 만들기</button><input id="joinCode" placeholder="6자리 방 코드" maxlength="6" style="width:145px;text-transform:uppercase"><button onclick="connect('join')">방 참가</button></div><p class="hint" id="wait">같은 기기에서 두 브라우저 창을 열어도 실시간 대전을 시험할 수 있어.</p><p id="notice"></p></section><div id="matchArea"><div class="status" id="status"></div><section class="panel"><div class="row" style="justify-content:space-between"><h2>⚡ 행동 선택</h2><span class="hint" id="selection">카드를 선택해 줘.</span></div><div class="toolbar"><button onclick="action('summon')">몬스터 소환</button><button onclick="action('move')">라인 이동</button><button onclick="action('attack')">공격 선언</button><button onclick="action('activate')">⚡ 기동 효과</button><button onclick="action('cast')">기술 발동</button><button onclick="action('pass')">대응 패스</button><button onclick="action('openWindow')">상대 대응 창</button><button class="primary" onclick="action('endTurn')">턴 종료 →</button></div><p class="hint">공격 대상, 제물, 기술 대상, 보호 여부는 자동 선택 창에서 결정해. 누를 수 없는 행동은 서버가 거부해.</p></section><div id="effectSources" class="status" style="margin:6px 0"></div><div id="board" class="grid"></div><section class="panel"><div class="row" style="justify-content:space-between"><h2>📜 공개 대전 기록</h2><button onclick="exportGame()">⬇ 기록 내려받기</button></div><div class="log" id="log"></div></section></div></main><div id="promptOverlay"><div class="dialog"><h2 id="promptTitle"></h2><div id="promptChoices"></div></div></div><div id="graveOverlay" class="hidden" style="position:fixed;inset:0;z-index:45;background:#010814ed;display:grid;place-items:center;padding:12px"><div class="dialog"><h2 id="graveHeading"></h2><div id="graveList" class="deckscroll"></div><button class="primary" onclick="closeGrave()">닫기</button></div></div><script>
'use strict';let DATA=null,DECKS={},ws=null,seat=-1,state=null,room='',selection=null,draft=null,editingRace=null,lastPromptKey='',lastSeq=0;
const $=id=>document.getElementById(id),names={Land:'🔴 랜드',Ocean:'🔵 오션',Sky:'🤍 스카이',Others:'🟣 아더스'};
const escape=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function say(t){$('notice').textContent=t}
async function boot(){const r=await fetch('/api/config');if(!r.ok)throw Error('설정 로드 실패');DATA=await r.json();CardClashDecks.init(DATA);for(const race of Object.keys(DATA.decks))DECKS[race]={...DATA.decks[race]};$('race').addEventListener('change',()=>refreshNamedDecks());refreshNamedDecks();}
function refreshNamedDecks(){if(!DATA)return;let r=$('race').value,items=CardClashDecks.list(r),sel=$('namedDeck'),old=sel.value;sel.replaceChildren();for(let d of items){let e=document.createElement('option');e.value=d.id;e.textContent=d.name+' ('+Object.values(d.cards).reduce((a,b)=>a+b,0)+'/30)';sel.append(e)}if(items.some(d=>d.id===old))sel.value=old;else if(items.length)sel.value=CardClashDecks.selected(r)?.id||items[0].id;selectNamedDeck()}
function selectNamedDeck(){if(!DATA)return;let r=$('race').value,d=CardClashDecks.deckById($('namedDeck').value);if(d&&d.race===r){DECKS[r]={...d.cards};CardClashDecks.setSelected(r,d.id)}updateDeckStatus()}
function updateDeckStatus(){let r=$('race').value,d=CardClashDecks.deckById($('namedDeck').value);$('deckStatus').textContent=d?Object.values(d.cards).reduce((a,b)=>a+b,0)+'/30장':'덱 없음'}
function editDeck(){if(ws)return;CardClashDecks.open($('race').value,()=>refreshNamedDecks())}

function connect(type){if(ws)return;const race=$('race').value,deck=CardClashDecks.deckById($('namedDeck').value)?.cards;if(!validDeck(race,deck))return say('30장으로 덱을 맞춰 줘.');
 const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.host+'/ws');say('서버 연결 중…');ws.onopen=()=>ws.send(JSON.stringify({type,race,deck,code:$('joinCode').value.trim()}));
 ws.onmessage=e=>{const msg=JSON.parse(e.data);if(msg.type==='error'){say(msg.message);if(state)alert(msg.message);else{if(msg.message.includes('방 코드')){ws.close();ws=null;}}}
 else if(msg.type==='lobby'){room=msg.room;seat=msg.seat;$('wait').textContent=msg.waiting?`대기 중 · 방 코드 ${room} (친구에게 코드 공유)`:`매칭 중…`;say('방 코드: '+room)}
 else if(msg.type==='balance'){for(const [name,attrs] of Object.entries(msg.cards||{})){const c=DATA.cards.find(x=>x.name===name);if(c)Object.assign(c,attrs)}DATA.rules.second_player_first_turn_bonus=msg.second_bonus;if(state)render()}
 else if(msg.type==='state'){if(msg.seq<=lastSeq)return;lastSeq=msg.seq;seat=msg.seat;room=msg.room;const prior=state;state=msg.state;if(prior){for(let k=0;k<2;k++)if(state.players[k].deck_count<prior.players[k].deck_count)flashed.add(k);if(flashed.size)setTimeout(()=>{flashed.clear();if(state)render()},650)}$('lobby').classList.add('hidden');$('matchArea').style.display='block';render()}};
 ws.onclose=()=>{say('연결이 종료됐어. 페이지를 새로고침하면 새 매칭을 시작할 수 있어.');ws=null};ws.onerror=()=>say('연결 오류. 서버가 실행 중인지 확인해 줘.');}
function action(name,extra={}){if(!ws||!state)return;if(['summon','move','attack','activate','cast'].includes(name)&&!selection)return alert('자기 카드 한 장을 먼저 선택해 줘.');
 ws.send(JSON.stringify({type:'action',action:name,zone:selection?.zone,id:selection?.id,...extra}));}
function choose(zone,id){selection={zone,id};$('selection').textContent='선택: '+(zone==='hand'?state.players[seat].hand[id]:'필드 카드 #'+id);render()}
function unitStats(u,owner){const c=DATA.cards.find(c=>c.name===u.name);const aura=state.players[owner].a.filter(x=>x.name==='지휘관 독수리').length*500;const witches=state.players[owner].b.filter(x=>x.name==='마녀여왕').length*500;return (c.atk+u.bonus+(c.race==='Sky'?aura:0)+(c.race==='Others'?witches:0)).toLocaleString()}
function effectHistory(u,owner){let c=DATA.cards.find(c=>c.name===u.name),steps=[...(u.mods||[])];if(c.race==='Sky')for(const x of state.players[owner].a.filter(x=>x.name==='지휘관 독수리'))steps.push({delta:500,source:'지휘관 독수리'});if(c.race==='Others')for(const x of state.players[owner].b.filter(x=>x.name==='마녀여왕'))steps.push({delta:500,source:'마녀여왕'});if(!steps.length)return '';return escape([c.atk,...steps.map(m=>(m.delta>=0?'+':'')+m.delta+' ['+(m.source||'효과')+']'),'= '+unitStats(u,owner)].join(' → '))}
const flashed=new Set();function showGrave(index){let q=state.players[index];const root=$('graveOverlay'),list=$('graveList'),heading=$('graveHeading');heading.textContent=`🪦 ${names[q.race]} 묘지 (${q.grave.length}장)`;if(!q.grave.length){list.innerHTML='<p>묘지에 카드가 없어.</p>'}else{const counts={};for(let n of q.grave)counts[n]=(counts[n]||0)+1;list.innerHTML=q.grave.slice().reverse().map((n,i)=>{let c=DATA.cards.find(x=>x.name===n);return `<div class="grave-item"><b>${escape(n)} · ${counts[n]}장</b><small>${c.type==='monster'?'ATK '+c.atk+' · '+c.cost+' ME':c.cost+' TE'} · ${escape(c.desc)}</small></div>`}).join('')}root.classList.remove('hidden')}
function closeGrave(){$('graveOverlay').classList.add('hidden')}
function card(name,zone,id,owner,u){let c=DATA.cards.find(x=>x.name===name);let isOwn=owner===seat;let cls=selection&&selection.zone===zone&&selection.id===id&&isOwn?' selected':'';let power=u?unitStats(u,owner):c.type==='monster'?'ATK '+c.atk.toLocaleString():'TE '+c.cost;
 return `<button class="card ${c.race}${cls}" ${isOwn?`onclick="choose('${zone}',${id})"`: 'disabled'}><strong>${escape(c.name)}</strong><small>${power}${c.type==='monster'&&u?' ATK':''} · ${c.cost} ${c.type==='monster'?'ME':'TE'}</small><small>${escape(c.desc)}</small>${u?`<small>행동 ${u.actions}/${c.effects.includes('rush')?2:1}</small><small class="effect-math">${effectHistory(u,owner)}</small>`:''}</button>`}
function playerHtml(index){let q=state.players[index],isOwn=index===seat;let field=(z)=>`<div class="line"><h3>${z.toUpperCase()}라인 · ${q[z].length}/5</h3><div class="cards">${q[z].map(u=>card(u.name,z,u.uid,index,u)).join('')}</div></div>`;
 return `<section class="panel"><h2>${isOwn?'🙋 나':'⚔️ 상대'} · ${names[q.race]}</h2><div class="row info"><span>ME ${q.me}</span><span>TE ${q.te}</span><span class="${flashed.has(index)?'deck-flash':''}">덱 ${q.deck_count}장${flashed.has(index)?' 💥':''}</span><span>패 ${q.hand_count}장</span><button class="small" onclick="showGrave(${index})">🪦 묘지 ${q.grave.length}장 보기</button></div>${field('a')}${field('b')}<h3>🃏 ${isOwn?'내 손패':'상대 손패 (비공개)'}</h3><div class="hand">${isOwn?q.hand.map((n,j)=>card(n,'hand',j,index)).join(''):`<span class="hint">🎴 뒷면 카드 ${q.hand_count}장 · 내용은 서버에서 숨김</span>`}</div><p class="info">묘지: ${escape(q.grave.slice(-12).join(' · ')||'없음')}</p></section>`}
function render(){if(!state)return;let turn=state.priority!==null?state.priority:state.active;
 $('status').textContent=state.winner?`🏆 승리: ${state.winner} | ${state.turn}턴`:`${state.turn}턴 · ${names[state.players[state.active].race]} 차례 · ${state.priority!==null?names[turn]+' 대응 우선권':'메인 단계'} | ${turn===seat?'✅ 내 행동':'상대 행동 대기'} | 방 ${room}`;
 $('board').innerHTML=playerHtml(seat)+playerHtml(1-seat); const effects=[...(state.stacks||[]).map(x=>x.sourceName||x.name),...(state.triggers||[]).map(x=>x.sourceName||x.name)];$('effectSources').textContent=effects.length?'⚡ 처리 대기: '+effects.join(' → '):'';
 $('log').innerHTML=state.logs.map(x=>`<div>${escape(x)}</div>`).join('');$('log').scrollTop=$('log').scrollHeight;
 const prompt=state.prompt;
 $('promptOverlay').style.display=prompt?'grid':'none';if(prompt){$('promptTitle').textContent=prompt.title;let list='';
 if(prompt.kind==='buttons')list=prompt.options.map((opt,j)=>`<button class="choice" onclick="answer({index:${j}})">${escape(opt)}</button>`).join('');
 else if(prompt.kind==='multi')list=prompt.options.map((opt,j)=>`<label class="deckitem"><input type="checkbox" class="multiCheck" value="${j}"> ${escape(opt)}</label>`).join('')+'<button class="choice primary" onclick="answer({indices:[...document.querySelectorAll(\'.multiCheck:checked\')].map(x=>Number(x.value))})">선택 완료</button>';
 else if(prompt.kind==='allocate')list=prompt.options.map((opt,j)=>`<label class="deckitem">${escape(opt)} <select class="allocSelect">${(prompt.choices[j]||[]).map(v=>`<option value="${escape(v)}">-${escape(v)}</option>`).join('')}</select></label>`).join('')+'<button class="choice primary" onclick="answer({values:[...document.querySelectorAll(\'.allocSelect\')].map(x=>Number(x.value))})">분배 완료 후 확정</button>';
 if(prompt.cancel)list+='<button class="choice" onclick="answer({cancel:true})">취소</button>';
 $('promptChoices').innerHTML=list;
 }
}
function exportGame(){if(!state)return;
 const obj={version:'Card Clash 2.5',room,turn:state.turn,winner:state.winner,races:state.players.map(p=>p.race),logs:state.logs};
 const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='cardclash_2.5_match_log.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);
}
function answer(data){if(!ws)return;ws.send(JSON.stringify({type:'action',action:data.cancel?'cancel_choice':'choice',...data}));$('promptOverlay').style.display='none'}
boot().catch(e=>say('초기화 오류: '+e.message));
</script><script src="decks.js"></script></body></html>
