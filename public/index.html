<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10141b" />
  <title>School Line Mobile</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="app">
    <section id="joinScreen" class="panel join-panel">
      <h1>School Line</h1>
      <p class="subtitle">Mobile Alpha 0.6 · 4 vs 4 점유전 · 12 캐릭터 · 캐릭터 식별 강화</p>
      <label>닉네임<input id="nameInput" maxlength="12" placeholder="예: 1번" autocomplete="off" /></label>
      <label>방 코드<input id="roomInput" maxlength="10" value="6-1" autocomplete="off" autocapitalize="characters" /></label>

      <div class="picker-shell">
        <div class="picker-heading">캐릭터 선택</div>
        <div id="joinRoleTabs" class="role-tabs"></div>
        <div id="joinCharacterChoices" class="character-choices"></div>
        <div id="joinCharacterDetail" class="character-detail"></div>
      </div>

      <button id="joinButton" class="accent big-button">입장</button>
      <p id="joinError" class="error"></p>
      <div class="help">📱 가로 화면 권장 · 왼쪽 스틱 이동 · 오른쪽 스틱 조준/사격 · 다이아는 변신 버튼</div>
    </section>

    <section id="lobbyScreen" class="hidden lobby-layout">
      <div class="panel lobby-main">
        <div class="row between lobby-title-row">
          <div><h2>방 <span id="roomLabel"></span></h2><div id="hostLabel" class="muted"></div></div>
          <div class="row compact-actions"><button id="fullscreenButton">가로 전체화면</button><button id="startButton" class="accent hidden">경기 시작</button></div>
        </div>
        <div id="resultBanner" class="result hidden"></div>
        <div class="teams">
          <div><h3>A팀</h3><div id="teamAList"></div></div>
          <div><h3>B팀</h3><div id="teamBList"></div></div>
        </div>
      </div>
      <aside class="panel character-panel">
        <h3>내 캐릭터</h3>
        <div id="lobbyRoleTabs" class="role-tabs"></div>
        <div id="lobbyCharacterChoices" class="character-choices compact"></div>
        <div id="lobbyCharacterDetail" class="character-detail"></div>
        <p class="muted small">캐릭터 중복 선택 허용. 첫 입장자가 방장입니다.</p>
      </aside>
    </section>

    <section id="gameScreen" class="hidden game-screen">
      <div id="rotateNotice" class="rotate-notice hidden">📱 휴대폰을 가로로 돌려주세요</div>
      <div class="game-stage">
        <canvas id="gameCanvas" width="1020" height="630"></canvas>

        <div class="top-hud">
          <div class="score-pill team-a">A <b id="scoreA">0</b></div>
          <div id="timer" class="timer">03:00</div>
          <div class="score-pill team-b">B <b id="scoreB">0</b></div>
        </div>

        <div id="myInfo" class="my-info"></div>
        <div id="respawn" class="respawn"></div>
        <button id="abilityButton" class="ability-button hidden">💎 변신</button>

        <div id="touchControls" class="touch-controls">
          <div id="moveZone" class="control-zone move-zone">
            <div class="joystick-base"><div id="moveKnob" class="joystick-knob"></div></div>
            <span class="control-label">이동</span>
          </div>
          <div id="aimZone" class="control-zone aim-zone">
            <div class="joystick-base"><div id="aimKnob" class="joystick-knob"></div></div>
            <span class="control-label">조준 · 발사</span>
          </div>
        </div>

        <button id="soundButton" class="sound-button" title="소리 끄기">🔊</button>
        <button id="gameFullscreenButton" class="game-fullscreen">⛶</button>
      </div>
    </section>
  </main>
  <script src="/game.js"></script>
</body>
</html>
